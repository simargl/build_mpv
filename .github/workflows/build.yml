name: Build mpv

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build mpv on Ubuntu 16.04
    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build inside Ubuntu 16.04
        run: |
          docker pull ubuntu:16.04

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ubuntu:16.04 \
            bash -euxo pipefail -c '

              echo "=================================================="
              echo "Ubuntu version"
              echo "=================================================="

              cat /etc/os-release

              echo "=================================================="
              echo "Fix Ubuntu 16.04 EOL repositories"
              echo "=================================================="

              printf "%s\n" \
                "deb http://old-releases.ubuntu.com/ubuntu/ xenial main restricted universe multiverse" \
                "deb http://old-releases.ubuntu.com/ubuntu/ xenial-updates main restricted universe multiverse" \
                "deb http://old-releases.ubuntu.com/ubuntu/ xenial-security main restricted universe multiverse" \
                > /etc/apt/sources.list

              rm -f /etc/apt/sources.list.d/*.list || true

              apt-get clean
              apt-get update

              echo "=================================================="
              echo "Install build dependencies"
              echo "=================================================="

              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                autoconf \
                automake \
                autopoint \
                libtool \
                pkg-config \
                gettext \
                git \
                wget \
                curl \
                ca-certificates \
                xz-utils \
                bzip2 \
                gzip \
                tar \
                patch \
                sed \
                gawk \
                file \
                nasm \
                yasm \
                python3 \
                python3-pip \
                python3-setuptools \
                python3-dev \
                libpython3-dev \
                ninja-build \
                squashfs-tools

              echo "=================================================="
              echo "Install Meson"
              echo "=================================================="

              python3 -m pip install \
                --upgrade \
                "meson==0.55.3"

              echo "Meson:"
              meson --version

              echo "Ninja:"
              ninja --version

              echo "Python:"
              python3 --version

              echo "GCC:"
              gcc --version

              echo "=================================================="
              echo "Make build script executable"
              echo "=================================================="

              chmod +x /src/build_mpv.sh

              echo "=================================================="
              echo "Starting mpv build"
              echo "=================================================="

              /src/build_mpv.sh

              echo "=================================================="
              echo "Build finished"
              echo "=================================================="

              ls -lah /tmp/mpv-build/

              if [ ! -f /tmp/mpv-build/mpv.sb ]; then
                echo "ERROR: mpv.sb was not created."
                exit 1
              fi

              echo "mpv.sb successfully created."

              file /tmp/mpv-build/mpv.sb
              du -h /tmp/mpv-build/mpv.sb

              echo "=================================================="
              echo "Copy artifact"
              echo "=================================================="

              cp \
                /tmp/mpv-build/mpv.sb \
                /src/mpv.sb

              echo "Artifact:"
              ls -lh /src/mpv.sb
            '

      - name: Verify artifact
        run: |
          test -f mpv.sb
          file mpv.sb
          ls -lh mpv.sb

      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-ubuntu-16.04-static
          path: mpv.sb
          if-no-files-found: error
          retention-days: 30
