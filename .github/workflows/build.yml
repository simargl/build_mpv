name: Build mpv

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Download Slackware filesystem
      # ------------------------------------------------------------
      - name: Download Slackware filesystem
        shell: bash
        run: |
          set -euxo pipefail

          wget -q --show-progress \
            "https://github.com/simargl/slik-linux/releases/download/slik-linux-0.1.0-284/fs-slackware.sb" \
            -O fs-slackware.sb

          ls -lh fs-slackware.sb
          file fs-slackware.sb

      # ------------------------------------------------------------
      # Extract Slackware filesystem
      # ------------------------------------------------------------
      - name: Extract Slackware filesystem
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf fs-root
          sudo mkdir -p fs-root

          sudo unsquashfs \
            -d fs-root \
            fs-slackware.sb

          sudo mkdir -p fs-root/github-workspace
          sudo mkdir -p fs-root/output

          echo "Slackware filesystem extracted"

          sudo ls -ld \
            fs-root \
            fs-root/usr \
            fs-root/bin \
            fs-root/github-workspace \
            fs-root/output

      # ------------------------------------------------------------
      # Mount GitHub workspace into Slackware filesystem
      # ------------------------------------------------------------
      - name: Mount workspace
        shell: bash
        run: |
          set -euxo pipefail

          sudo mount --bind \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/fs-root/github-workspace"

          sudo mount --bind \
            "$GITHUB_WORKSPACE/output" \
            "$GITHUB_WORKSPACE/fs-root/output"

          mount | grep fs-root

      # ------------------------------------------------------------
      # Build inside Slackware 14.2
      # ------------------------------------------------------------
      - name: Build mpv inside Slackware
        shell: bash
        run: |
          set -euxo pipefail

          sudo chroot \
            "$GITHUB_WORKSPACE/fs-root" \
            /bin/bash -euxo pipefail -c '

              export HOME=/root
              export LC_ALL=C
              export LANG=C

              export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

              cd /github-workspace

              echo "=================================================="
              echo " Slackware version"
              echo "=================================================="

              cat /etc/slackware-version || true

              echo
              echo "=================================================="
              echo " Kernel"
              echo "=================================================="

              uname -a

              echo
              echo "=================================================="
              echo " Python"
              echo "=================================================="

              python3 --version
              which python3

              echo
              echo "=================================================="
              echo " Installing Ninja"
              echo "=================================================="

              fetch it ninja

              echo
              echo "Ninja:"
              which ninja
              ninja --version

              echo
              echo "=================================================="
              echo " Build tools"
              echo "=================================================="

              echo "gcc:"
              gcc --version | head -n 1

              echo
              echo "make:"
              make --version | head -n 1

              echo
              echo "pkg-config:"
              pkg-config --version

              echo
              echo "python3:"
              python3 --version

              echo
              echo "ninja:"
              ninja --version

              echo
              echo "=================================================="
              echo " Starting build_mpv.sh"
              echo "=================================================="

              chmod +x ./build_mpv.sh

              ./build_mpv.sh

              echo
              echo "=================================================="
              echo " Build completed"
              echo "=================================================="

              echo
              echo "mpv:"
              /tmp/mpv-build/pkg/bin/mpv \
                --version | head -n 10

              echo
              echo "mpv binary:"
              file /tmp/mpv-build/pkg/bin/mpv

              echo
              echo "mpv dependencies:"
              ldd /tmp/mpv-build/pkg/bin/mpv || true

              echo
              echo "mpv.sb:"
              ls -lh /tmp/mpv-build/mpv.sb

              file /tmp/mpv-build/mpv.sb

              echo
              echo "=================================================="
              echo " Copying artifact"
              echo "=================================================="

              mkdir -p /output

              cp -v \
                /tmp/mpv-build/mpv.sb \
                /output/mpv.sb

              ls -lh /output/mpv.sb
            '

      # ------------------------------------------------------------
      # Unmount filesystem
      # ------------------------------------------------------------
      - name: Unmount Slackware filesystem
        if: always()
        shell: bash
        run: |
          set +e

          sudo umount \
            "$GITHUB_WORKSPACE/fs-root/output" \
            2>/dev/null || true

          sudo umount \
            "$GITHUB_WORKSPACE/fs-root/github-workspace" \
            2>/dev/null || true

      # ------------------------------------------------------------
      # Upload mpv bundle
      # ------------------------------------------------------------
      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static-slackware
          path: output/mpv.sb
          if-no-files-found: error
