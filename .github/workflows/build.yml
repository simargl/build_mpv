name: Build mpv

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build mpv - Ubuntu 16.04
    runs-on: ubuntu-latest

    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build mpv inside Ubuntu 16.04
        shell: bash
        run: |
          set -e

          docker pull ubuntu:16.04

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ubuntu:16.04 \
            bash -euxo pipefail -c '

              echo
              echo "=================================================="
              echo " Ubuntu version"
              echo "=================================================="
              cat /etc/os-release

              echo
              echo "=================================================="
              echo " Configure Xenial repositories"
              echo "=================================================="

              printf "%s\n" \
                "deb http://archive.ubuntu.com/ubuntu/ xenial main restricted universe multiverse" \
                "deb http://archive.ubuntu.com/ubuntu/ xenial-updates main restricted universe multiverse" \
                "deb http://archive.ubuntu.com/ubuntu/ xenial-security main restricted universe multiverse" \
                > /etc/apt/sources.list

              rm -f /etc/apt/sources.list.d/*.list || true

              apt-get clean

              echo
              echo "=================================================="
              echo " apt update"
              echo "=================================================="

              apt-get update

              echo
              echo "=================================================="
              echo " Install build dependencies"
              echo "=================================================="

              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                autoconf \
                automake \
                autopoint \
                libtool \
                pkg-config \
                gettext \
                git \
                wget \
                curl \
                ca-certificates \
                xz-utils \
                bzip2 \
                gzip \
                tar \
                patch \
                sed \
                gawk \
                file \
                nasm \
                yasm \
                make \
                cmake \
                python3 \
                python3-dev \
                python3-pip \
                python3-setuptools \
                libpython3-dev \
                ninja-build \
                squashfs-tools

              echo
              echo "=================================================="
              echo " Tool versions"
              echo "=================================================="

              gcc --version | head -n 1
              make --version | head -n 1
              cmake --version | head -n 1
              nasm -v
              yasm --version | head -n 1
              python3 --version
              ninja --version

              echo
              echo "=================================================="
              echo " Install compatible pip"
              echo "=================================================="

              python3 -m pip install \
                --no-cache-dir \
                --upgrade \
                "pip==20.3.4" \
                "setuptools==44.1.1" \
                "wheel==0.34.2"

              echo
              echo "=================================================="
              echo " Install Meson"
              echo "=================================================="

              python3 -m pip install \
                --no-cache-dir \
                "meson==0.55.3"

              meson --version

              echo
              echo "=================================================="
              echo " Check source tree"
              echo "=================================================="

              ls -lah /src

              test -f /src/build_mpv.sh

              chmod +x /src/build_mpv.sh

              echo
              echo "=================================================="
              echo " Start mpv build"
              echo "=================================================="

              /src/build_mpv.sh

              echo
              echo "=================================================="
              echo " Build completed"
              echo "=================================================="

              if [ ! -f /tmp/mpv-build/mpv.sb ]; then
                echo
                echo "ERROR: /tmp/mpv-build/mpv.sb was not created."
                echo
                echo "Contents of /tmp/mpv-build:"
                find /tmp/mpv-build -maxdepth 2 -type f -o -type l | sort || true
                exit 1
              fi

              echo
              echo "=================================================="
              echo " Verify squashfs bundle"
              echo "=================================================="

              file /tmp/mpv-build/mpv.sb
              ls -lh /tmp/mpv-build/mpv.sb
              du -h /tmp/mpv-build/mpv.sb

              echo
              echo "=================================================="
              echo " Copy artifact"
              echo "=================================================="

              cp \
                /tmp/mpv-build/mpv.sb \
                /src/mpv.sb

              ls -lh /src/mpv.sb

              echo
              echo "=================================================="
              echo " SUCCESS"
              echo "=================================================="
            '

      - name: Verify generated bundle
        run: |
          set -eux

          test -f mpv.sb

          file mpv.sb
          ls -lh mpv.sb
          du -h mpv.sb

      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-ubuntu-16.04-av1
          path: mpv.sb
          if-no-files-found: error
          retention-days: 30
