name: Build mpv

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Ubuntu 18.04
        shell: bash
        run: |
          set -eux

          docker pull ubuntu:18.04

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$GITHUB_WORKSPACE/output:/output" \
            -w /src \
            ubuntu:18.04 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              echo "=================================================="
              echo " Ubuntu version"
              echo "=================================================="
              cat /etc/os-release

              echo "=================================================="
              echo " Installing build dependencies"
              echo "=================================================="

              apt-get update

              apt-get install -y \
                build-essential \
                autoconf \
                automake \
                libtool \
                pkg-config \
                gettext \
                git \
                wget \
                curl \
                ca-certificates \
                xz-utils \
                bzip2 \
                gzip \
                tar \
                patch \
                nasm \
                yasm \
                python3 \
                python3-pip \
                python3-setuptools \
                ninja-build \
                squashfs-tools \
                perl \
                texinfo

              echo "=================================================="
              echo " Installing compatible Python tools"
              echo "=================================================="

              python3 -m pip install \
                --no-cache-dir \
                "pip==20.3.4" \
                "setuptools==44.1.1" \
                "wheel==0.34.2" \
                "meson==0.55.3"

              echo "=================================================="
              echo " Toolchain"
              echo "=================================================="

              python3 --version
              pip3 --version
              meson --version
              ninja --version
              nasm -version
              yasm --version

              echo "=================================================="
              echo " Building"
              echo "=================================================="

              chmod +x ./build_mpv.sh
              ./build_mpv.sh

              echo "=================================================="
              echo " Copying artifact"
              echo "=================================================="

              mkdir -p /output
              cp -v /tmp/mpv-build/mpv.sb /output/mpv.sb
              ls -lh /output/mpv.sb
            '

      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static
          path: output/mpv.sb
          if-no-files-found: error
