name: Build mpv

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools \
            wget

      - name: Download fs-slackware.sb
        shell: bash
        run: |
          set -euxo pipefail

          wget -q --show-progress \
            https://github.com/simargl/slik-linux/releases/download/slik-linux-0.1.0-284/fs-slackware.sb \
            -O fs-slackware.sb

          ls -lh fs-slackware.sb

      - name: Extract fs-slackware.sb
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf fs-root

          # IMPORTANT:
          # unsquashfs must run as root so it can recreate
          # /dev/null, /dev/random, etc.
          sudo unsquashfs -d fs-root fs-slackware.sb

          echo "=================================================="
          echo " Slackware filesystem"
          echo "=================================================="

          sudo cat fs-root/etc/slackware-version || true

          echo
          echo "Checking device nodes..."

          sudo ls -l fs-root/dev/null
          sudo ls -l fs-root/dev/random

      - name: Prepare chroot
        shell: bash
        run: |
          set -euxo pipefail

          sudo mkdir -p \
            fs-root/github-workspace \
            fs-root/output

          # Source tree
          sudo mount --bind \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/fs-root/github-workspace"

          # Output directory
          sudo mount --bind \
            "$GITHUB_WORKSPACE/output" \
            "$GITHUB_WORKSPACE/fs-root/output"

          # proc
          sudo mount -t proc \
            proc \
            "$GITHUB_WORKSPACE/fs-root/proc"

          # sys
          sudo mount --rbind \
            /sys \
            "$GITHUB_WORKSPACE/fs-root/sys"

          sudo mount --make-rslave \
            "$GITHUB_WORKSPACE/fs-root/sys"

          # dev
          sudo mount --rbind \
            /dev \
            "$GITHUB_WORKSPACE/fs-root/dev"

          sudo mount --make-rslave \
            "$GITHUB_WORKSPACE/fs-root/dev"

          # DNS
          sudo cp -L \
            /etc/resolv.conf \
            "$GITHUB_WORKSPACE/fs-root/etc/resolv.conf"

      - name: Build mpv inside fs-slackware
        shell: bash
        run: |
          set -euxo pipefail

          sudo chroot "$GITHUB_WORKSPACE/fs-root" \
            /bin/bash -euxo pipefail -c '

              export HOME=/root
              export LC_ALL=C
              export LANG=C

              export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

              cd /github-workspace

              echo "=================================================="
              echo " Slackware build environment"
              echo "=================================================="

              cat /etc/slackware-version || true
              uname -a

              echo
              echo "=================================================="
              echo " Toolchain"
              echo "=================================================="

              command -v gcc
              command -v g++
              command -v make
              command -v ar
              command -v ranlib
              command -v strip
              command -v pkg-config
              command -v python3
              command -v wget
              command -v tar

              gcc --version
              make --version
              python3 --version
              pkg-config --version

              echo
              echo "=================================================="
              echo " Optional tools"
              echo "=================================================="

              meson --version || true
              ninja --version || true
              nasm -version || true
              yasm --version || true
              cmake --version || true
              autoconf --version | head -n 1 || true
              automake --version | head -n 1 || true

              echo
              echo "=================================================="
              echo " Building mpv"
              echo "=================================================="

              chmod +x ./build_mpv.sh

              ./build_mpv.sh

              echo
              echo "=================================================="
              echo " Build completed"
              echo "=================================================="

              test -x /tmp/mpv-build/pkg/bin/mpv
              test -f /tmp/mpv-build/mpv.sb

              ls -lh /tmp/mpv-build/mpv.sb

              echo
              echo "=================================================="
              echo " Copying mpv.sb"
              echo "=================================================="

              cp -v \
                /tmp/mpv-build/mpv.sb \
                /output/mpv.sb

              ls -lh /output/mpv.sb
            '

      - name: Cleanup mounts
        if: always()
        shell: bash
        run: |
          set +e

          sudo umount -R "$GITHUB_WORKSPACE/fs-root/dev" 2>/dev/null || true
          sudo umount -R "$GITHUB_WORKSPACE/fs-root/sys" 2>/dev/null || true
          sudo umount "$GITHUB_WORKSPACE/fs-root/proc" 2>/dev/null || true
          sudo umount "$GITHUB_WORKSPACE/fs-root/output" 2>/dev/null || true
          sudo umount "$GITHUB_WORKSPACE/fs-root/github-workspace" 2>/dev/null || true

      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static
          path: output/mpv.sb
          if-no-files-found: error
