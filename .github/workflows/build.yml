name: Build mpv

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:18.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            git \
            wget \
            curl \
            ca-certificates \
            xz-utils \
            bzip2 \
            gzip \
            tar \
            patch \
            nasm \
            yasm \
            python3 \
            python3-pip \
            python3-setuptools \
            ninja-build \
            squashfs-tools \
            perl \
            texinfo

      - name: Install compatible Python tools
        shell: bash
        run: |
          set -eux

          python3 -m pip install --no-cache-dir \
            'pip==20.3.4' \
            'setuptools==44.1.1' \
            'wheel==0.34.2' \
            'meson==0.55.3'

      - name: Show toolchain
        shell: bash
        run: |
          set -eux
          cat /etc/os-release
          python3 --version
          pip3 --version
          meson --version
          ninja --version
          nasm -version
          yasm --version

      - name: Build
        shell: bash
        run: |
          chmod +x ./build_mpv.sh
          ./build_mpv.sh

      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static
          path: /tmp/mpv-build/mpv.sb
          if-no-files-found: error
