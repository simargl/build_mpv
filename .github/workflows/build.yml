name: Build mpv

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SquashFS tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Download fs-slackware.sb
        shell: bash
        run: |
          set -euxo pipefail

          wget -q --show-progress \
            https://github.com/simargl/slik-linux/releases/download/slik-linux-0.1.0-284/fs-slackware.sb \
            -O fs-slackware.sb

          ls -lh fs-slackware.sb

      - name: Extract Slackware filesystem
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf fs-root
          unsquashfs -d fs-root fs-slackware.sb

          echo "=================================================="
          echo " Slackware filesystem"
          echo "=================================================="

          cat fs-root/etc/slackware-version || true

      - name: Build mpv in Slackware filesystem
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p output

          # Give the extracted Slackware filesystem access to the
          # GitHub workspace and required virtual filesystems.
          sudo mount --bind "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/fs-root/github-workspace"

          sudo mount -t proc proc \
            "$GITHUB_WORKSPACE/fs-root/proc"

          sudo mount --rbind /sys \
            "$GITHUB_WORKSPACE/fs-root/sys"

          sudo mount --make-rslave \
            "$GITHUB_WORKSPACE/fs-root/sys"

          sudo mount --rbind /dev \
            "$GITHUB_WORKSPACE/fs-root/dev"

          sudo mount --make-rslave \
            "$GITHUB_WORKSPACE/fs-root/dev"

          # DNS/network access for wget/curl.
          sudo cp -L /etc/resolv.conf \
            "$GITHUB_WORKSPACE/fs-root/etc/resolv.conf"

          # Make /output available inside the chroot.
          sudo mkdir -p "$GITHUB_WORKSPACE/fs-root/output"

          sudo mount --bind \
            "$GITHUB_WORKSPACE/output" \
            "$GITHUB_WORKSPACE/fs-root/output"

          echo "=================================================="
          echo " Entering fs-slackware.sb"
          echo "=================================================="

          sudo chroot "$GITHUB_WORKSPACE/fs-root" \
            /bin/bash -euxo pipefail -c '

              export HOME=/root
              export LC_ALL=C
              export LANG=C

              export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

              cd /github-workspace

              echo "=================================================="
              echo " Slackware"
              echo "=================================================="

              cat /etc/slackware-version || true
              uname -a

              echo "=================================================="
              echo " Build tools"
              echo "=================================================="

              command -v gcc
              command -v g++
              command -v make
              command -v python3
              command -v wget
              command -v tar
              command -v pkg-config

              gcc --version
              make --version
              python3 --version

              echo "=================================================="
              echo " Optional build tools"
              echo "=================================================="

              meson --version || true
              ninja --version || true
              nasm -version || true
              yasm --version || true
              cmake --version || true

              echo "=================================================="
              echo " Building mpv"
              echo "=================================================="

              chmod +x ./build_mpv.sh

              ./build_mpv.sh

              echo "=================================================="
              echo " Build finished"
              echo "=================================================="

              test -f /tmp/mpv-build/mpv.sb

              ls -lh /tmp/mpv-build/mpv.sb

              echo "=================================================="
              echo " Copying mpv.sb"
              echo "=================================================="

              cp -v \
                /tmp/mpv-build/mpv.sb \
                /output/mpv.sb

              ls -lh /output/mpv.sb
            '

      - name: Cleanup mounts
        if: always()
        shell: bash
        run: |
          set +e

          sudo umount -R "$GITHUB_WORKSPACE/fs-root/dev" 2>/dev/null || true
          sudo umount -R "$GITHUB_WORKSPACE/fs-root/sys" 2>/dev/null || true
          sudo umount "$GITHUB_WORKSPACE/fs-root/proc" 2>/dev/null || true
          sudo umount "$GITHUB_WORKSPACE/fs-root/output" 2>/dev/null || true
          sudo umount "$GITHUB_WORKSPACE/fs-root/github-workspace" 2>/dev/null || true

      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static
          path: output/mpv.sb
          if-no-files-found: error
