name: Build mpv

on:
  workflow_dispatch:

  push:
    branches:
      - master

  schedule:
    - cron: '0 3 14 * *'
    - cron: '0 3 28 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Ubuntu 16.04
        shell: bash
        run: |
          set -eux

          docker pull ubuntu:16.04

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$GITHUB_WORKSPACE/output:/output" \
            -w /src \
            ubuntu:16.04 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              echo "=================================================="
              echo " Ubuntu version"
              echo "=================================================="
              cat /etc/os-release

              echo "=================================================="
              echo " Enabling Ubuntu Xenial backports"
              echo "=================================================="

              cat > /etc/apt/sources.list.d/backports.list <<EOF
          deb http://archive.ubuntu.com/ubuntu xenial-backports main restricted universe multiverse
          EOF

              echo "=================================================="
              echo " Updating package lists"
              echo "=================================================="

              apt-get update -y
              apt-get upgrade -y

              echo "=================================================="
              echo " Installing build dependencies"
              echo "=================================================="

              apt-get install -y \
                  build-essential \
                  autoconf \
                  automake \
                  libtool \
                  pkg-config \
                  gettext \
                  git \
                  wget \
                  curl \
                  ca-certificates \
                  xz-utils \
                  bzip2 \
                  gzip \
                  tar \
                  patch \
                  nasm \
                  yasm \
                  python3 \
                  python3-pip \
                  python3-setuptools \
                  squashfs-tools \
                  perl \
                  meson \
                  ninja-build \
                  cmake \
                  zlib1g-dev \
                  libssl-dev \
                  libgl1-mesa-dev \
                  libegl1-mesa-dev \
                  libgbm-dev \
                  libgles2-mesa-dev \
                  libdrm-dev \
                  libx11-dev \
                  libx11-xcb-dev \
                  libxext-dev \
                  libxinerama-dev \
                  libxrandr-dev \
                  libxss-dev \
                  libxpresent-dev \
                  libxv-dev \
                  libxcb1-dev \
                  libxcb-render0-dev \
                  libxcb-shm0-dev \
                  libxcb-xfixes0-dev \
                  libxcb-shape0-dev \
                  libxcb-glx0-dev \
                  libxcb-present-dev \
                  libxcb-sync-dev \
                  libxcb-dri3-dev \
                  libasound2-dev \
                  libpulse-dev \
                  libva-dev \
                  libfontconfig1-dev \
                  libfreetype6-dev \
                  libfribidi-dev \
                  libass-dev \
                  libjpeg-dev \
                  libpng-dev \
                  libexpat1-dev \
                  libcdio-dev \
                  libdvdread-dev \
                  libdvdnav-dev \
                  liblua5.2-dev \
                  texinfo

              echo "=================================================="
              echo " Installing Ninja 1.7.1"
              echo "=================================================="

              apt-get install -y -t xenial-backports ninja-build

              echo "Ninja version:"
              ninja --version

              test "$(ninja --version)" = "1.7.1"

              echo "=================================================="
              echo " Installing compatible Python tools"
              echo "=================================================="

              python3 -m pip install \
                --no-cache-dir \
                "pip==20.3.4" \
                "setuptools==44.1.1" \
                "wheel==0.34.2" \
                "meson==0.55.3"

              echo "=================================================="
              echo " Toolchain"
              echo "=================================================="

              python3 --version
              pip3 --version
              meson --version
              ninja --version
              nasm -version
              yasm --version

              echo "=================================================="
              echo " Building"
              echo "=================================================="

              chmod +x ./build_mpv.sh
              ./build_mpv.sh

              echo "=================================================="
              echo " Copying artifact"
              echo "=================================================="

              mkdir -p /output

              cp -v \
                /tmp/mpv-build/mpv.sb \
                /output/mpv.sb

              ls -lh /output/mpv.sb
            '

      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static
          path: output/mpv.sb
          if-no-files-found: error

      - name: Remove previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_PREFIX="${{ github.event.repository.name }}-0.1.0-"

          gh release list \
            --limit 1000 \
            --json tagName \
            --jq ".[] | select(.tagName | startswith(\"$TAG_PREFIX\")) | .tagName" \
          | while read -r tag; do
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.repository.name }}-0.1.0-${{ github.run_number }}"

          echo "Creating release: $TAG"

          gh release create "$TAG" \
            "output/mpv.sb" \
            --title "$TAG" \
            --generate-notes
