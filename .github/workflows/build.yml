name: Build mpv

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Download Slackware filesystem
      # ---------------------------------------------------------------
      - name: Download fs-slackware.sb
        shell: bash
        run: |
          set -euxo pipefail

          wget -q --show-progress \
            "https://github.com/simargl/slik-linux/releases/download/slik-linux-0.1.0-284/fs-slackware.sb" \
            -O fs-slackware.sb

          ls -lh fs-slackware.sb
          file fs-slackware.sb

      # ---------------------------------------------------------------
      # Build inside Slackware 14.2
      # ---------------------------------------------------------------
      - name: Build inside Slackware 14.2
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "Preparing Slackware filesystem"
          echo "=================================================="

          rm -rf fs-root

          sudo unsquashfs \
            -d fs-root \
            fs-slackware.sb

          # IMPORTANT:
          # Both directories must exist before mount --bind.
          mkdir -p output

          sudo mkdir -p fs-root/github-workspace
          sudo mkdir -p fs-root/output

          echo "=================================================="
          echo "Mounting GitHub workspace"
          echo "=================================================="

          sudo mount --bind \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/fs-root/github-workspace"

          sudo mount --bind \
            "$GITHUB_WORKSPACE/output" \
            "$GITHUB_WORKSPACE/fs-root/output"

          cleanup() {
            set +e

            sudo umount \
              "$GITHUB_WORKSPACE/fs-root/output" \
              2>/dev/null || true

            sudo umount \
              "$GITHUB_WORKSPACE/fs-root/github-workspace" \
              2>/dev/null || true
          }

          trap cleanup EXIT

          echo "=================================================="
          echo "Entering Slackware 14.2"
          echo "=================================================="

          sudo chroot fs-root /bin/bash -euxo pipefail -c '
            export HOME=/root
            export TERM=xterm
            export DEBIAN_FRONTEND=noninteractive

            export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

            echo "=================================================="
            echo "Slackware version"
            echo "=================================================="

            cat /etc/slackware-version || true

            echo
            uname -a

            echo "=================================================="
            echo "CPU"
            echo "=================================================="

            nproc || true

            echo "=================================================="
            echo "Python"
            echo "=================================================="

            python3 --version

            echo "=================================================="
            echo "Installing Ninja"
            echo "=================================================="

            fetch it ninja

            echo "=================================================="
            echo "Ninja"
            echo "=================================================="

            ninja --version

            echo "=================================================="
            echo "Build environment"
            echo "=================================================="

            gcc --version | head -n 1
            make --version | head -n 1
            pkg-config --version
            wget --version | head -n 1
            tar --version | head -n 1

            echo "=================================================="
            echo "Building mpv"
            echo "=================================================="

            cd /github-workspace

            chmod +x ./build_mpv.sh

            ./build_mpv.sh

            echo "=================================================="
            echo "Build complete"
            echo "=================================================="

            test -f /tmp/mpv-build/mpv.sb

            ls -lh /tmp/mpv-build/mpv.sb

            echo "=================================================="
            echo "Copying artifact"
            echo "=================================================="

            cp -v \
              /tmp/mpv-build/mpv.sb \
              /output/mpv.sb

            ls -lh /output/mpv.sb
          '

      # ---------------------------------------------------------------
      # Upload artifact
      # ---------------------------------------------------------------
      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static-slackware-14.2
          path: output/mpv.sb
          if-no-files-found: error
