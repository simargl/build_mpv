name: Build mpv

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Host tools
      #
      # Ubuntu is ONLY used as the GitHub Actions host.
      # The actual mpv build happens inside fs-slackware.sb.
      # ------------------------------------------------------------

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            squashfs-tools \
            wget


      # ------------------------------------------------------------
      # Download Slackware filesystem
      # ------------------------------------------------------------

      - name: Download fs-slackware.sb
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo " Downloading fs-slackware.sb"
          echo "=================================================="

          wget -q --show-progress \
            https://github.com/simargl/slik-linux/releases/download/slik-linux-0.1.0-284/fs-slackware.sb \
            -O fs-slackware.sb

          echo
          echo "Downloaded filesystem:"

          ls -lh fs-slackware.sb

          file fs-slackware.sb


      # ------------------------------------------------------------
      # Extract Slackware filesystem
      # ------------------------------------------------------------

      - name: Extract fs-slackware.sb
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo " Extracting fs-slackware.sb"
          echo "=================================================="

          sudo rm -rf fs-root

          # IMPORTANT:
          # sudo is required because fs-slackware.sb contains
          # character devices such as /dev/null and /dev/random.
          sudo unsquashfs \
            -d fs-root \
            fs-slackware.sb

          echo
          echo "=================================================="
          echo " Slackware filesystem"
          echo "=================================================="

          sudo cat fs-root/etc/slackware-version || true

          echo
          echo "Filesystem size:"
          sudo du -sh fs-root

          echo
          echo "Checking device nodes:"

          sudo ls -l fs-root/dev/null
          sudo ls -l fs-root/dev/random

          echo
          echo "Checking shell:"

          sudo ls -l fs-root/bin/bash


      # ------------------------------------------------------------
      # Prepare directories and mounts
      # ------------------------------------------------------------

      - name: Prepare chroot
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo " Preparing chroot"
          echo "=================================================="

          # IMPORTANT:
          # The host-side output directory must exist BEFORE
          # it can be used as a bind mount source.
          mkdir -p "$GITHUB_WORKSPACE/output"

          # Directories inside the Slackware filesystem.
          sudo mkdir -p \
            "$GITHUB_WORKSPACE/fs-root/github-workspace" \
            "$GITHUB_WORKSPACE/fs-root/output" \
            "$GITHUB_WORKSPACE/fs-root/proc" \
            "$GITHUB_WORKSPACE/fs-root/sys" \
            "$GITHUB_WORKSPACE/fs-root/dev"

          echo
          echo "=================================================="
          echo " Mounting GitHub workspace"
          echo "=================================================="

          sudo mount --bind \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/fs-root/github-workspace"

          echo
          echo "=================================================="
          echo " Mounting output directory"
          echo "=================================================="

          sudo mount --bind \
            "$GITHUB_WORKSPACE/output" \
            "$GITHUB_WORKSPACE/fs-root/output"

          echo
          echo "=================================================="
          echo " Mounting /proc"
          echo "=================================================="

          sudo mount -t proc \
            proc \
            "$GITHUB_WORKSPACE/fs-root/proc"

          echo
          echo "=================================================="
          echo " Mounting /sys"
          echo "=================================================="

          sudo mount --rbind \
            /sys \
            "$GITHUB_WORKSPACE/fs-root/sys"

          sudo mount --make-rslave \
            "$GITHUB_WORKSPACE/fs-root/sys"

          echo
          echo "=================================================="
          echo " Mounting /dev"
          echo "=================================================="

          sudo mount --rbind \
            /dev \
            "$GITHUB_WORKSPACE/fs-root/dev"

          sudo mount --make-rslave \
            "$GITHUB_WORKSPACE/fs-root/dev"

          echo
          echo "=================================================="
          echo " Configuring DNS"
          echo "=================================================="

          sudo cp -L \
            /etc/resolv.conf \
            "$GITHUB_WORKSPACE/fs-root/etc/resolv.conf"

          echo
          echo "=================================================="
          echo " Chroot mounts"
          echo "=================================================="

          mount | grep "$GITHUB_WORKSPACE/fs-root" || true


      # ------------------------------------------------------------
      # Build inside fs-slackware.sb
      # ------------------------------------------------------------

      - name: Build mpv inside Slackware
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo " Entering fs-slackware.sb"
          echo "=================================================="

          sudo chroot \
            "$GITHUB_WORKSPACE/fs-root" \
            /bin/bash -euxo pipefail -c '

              # --------------------------------------------------
              # Environment
              # --------------------------------------------------

              export HOME=/root
              export LC_ALL=C
              export LANG=C

              export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

              # --------------------------------------------------
              # Workspace
              # --------------------------------------------------

              cd /github-workspace

              echo "=================================================="
              echo " Slackware build environment"
              echo "=================================================="

              echo
              echo "Slackware version:"
              cat /etc/slackware-version || true

              echo
              echo "Kernel:"
              uname -a

              echo
              echo "Architecture:"
              uname -m

              echo
              echo "=================================================="
              echo " Checking required tools"
              echo "=================================================="

              echo
              echo "--- gcc ---"
              command -v gcc
              gcc --version

              echo
              echo "--- g++ ---"
              command -v g++
              g++ --version

              echo
              echo "--- make ---"
              command -v make
              make --version | head -n 1

              echo
              echo "--- ar ---"
              command -v ar
              ar --version | head -n 1

              echo
              echo "--- ranlib ---"
              command -v ranlib
              ranlib --version | head -n 1

              echo
              echo "--- strip ---"
              command -v strip
              strip --version | head -n 1

              echo
              echo "--- pkg-config ---"
              command -v pkg-config
              pkg-config --version

              echo
              echo "--- python3 ---"
              command -v python3
              python3 --version

              echo
              echo "--- wget ---"
              command -v wget
              wget --version | head -n 1

              echo
              echo "--- tar ---"
              command -v tar
              tar --version | head -n 1

              echo
              echo "=================================================="
              echo " Optional build tools"
              echo "=================================================="

              echo
              echo "--- cmake ---"
              cmake --version || true

              echo
              echo "--- meson ---"
              meson --version || true

              echo
              echo "--- ninja ---"
              ninja --version || true

              echo
              echo "--- nasm ---"
              nasm -version || true

              echo
              echo "--- yasm ---"
              yasm --version || true

              echo
              echo "--- autoconf ---"
              autoconf --version | head -n 1 || true

              echo
              echo "--- automake ---"
              automake --version | head -n 1 || true

              echo
              echo "--- libtool ---"
              libtool --version | head -n 1 || true

              echo
              echo "=================================================="
              echo " Network test"
              echo "=================================================="

              wget -q \
                --spider \
                https://www.google.com

              echo "Network access OK"

              echo
              echo "=================================================="
              echo " Starting build_mpv.sh"
              echo "=================================================="

              chmod +x ./build_mpv.sh

              ./build_mpv.sh

              echo
              echo "=================================================="
              echo " Build completed"
              echo "=================================================="

              echo
              echo "Checking mpv:"

              test -x /tmp/mpv-build/pkg/bin/mpv

              /tmp/mpv-build/pkg/bin/mpv \
                --version | head -n 10

              echo
              echo "Checking mpv file:"

              file /tmp/mpv-build/pkg/bin/mpv

              echo
              echo "Checking final squashfs:"

              test -f /tmp/mpv-build/mpv.sb

              ls -lh /tmp/mpv-build/mpv.sb

              file /tmp/mpv-build/mpv.sb

              echo
              echo "=================================================="
              echo " Copying mpv.sb"
              echo "=================================================="

              cp -v \
                /tmp/mpv-build/mpv.sb \
                /output/mpv.sb

              echo
              echo "Output:"

              ls -lh /output/mpv.sb
            '


      # ------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------

      - name: Cleanup mounts
        if: always()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo " Cleaning up mounts"
          echo "=================================================="

          sudo umount -R \
            "$GITHUB_WORKSPACE/fs-root/dev" \
            2>/dev/null || true

          sudo umount -R \
            "$GITHUB_WORKSPACE/fs-root/sys" \
            2>/dev/null || true

          sudo umount \
            "$GITHUB_WORKSPACE/fs-root/proc" \
            2>/dev/null || true

          sudo umount \
            "$GITHUB_WORKSPACE/fs-root/output" \
            2>/dev/null || true

          sudo umount \
            "$GITHUB_WORKSPACE/fs-root/github-workspace" \
            2>/dev/null || true

          echo "Cleanup complete"


      # ------------------------------------------------------------
      # Upload resulting mpv.sb
      # ------------------------------------------------------------

      - name: Upload mpv bundle
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static-slackware
          path: output/mpv.sb
          if-no-files-found: error
